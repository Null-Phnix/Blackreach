name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgbm-dev

      - name: Install Python dependencies
        run: |
          python -m pip install uv==0.10.4
          uv sync --locked --extra dev --extra server

      - name: Install Playwright browser
        run: uv run playwright install chromium

      - name: Run unit tests
        run: |
          uv run pytest tests/ \
            --timeout=30 \
            -x \
            -q \
            --tb=short \
            --ignore=tests/test_integration.py \
            --ignore=tests/test_agent_e2e.py \
            --ignore=tests/test_integration_browser.py \
            --ignore=tests/test_integration_agent.py \
            --cov=blackreach \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.11'
        with:
          name: blackreach-coverage-py311
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7
