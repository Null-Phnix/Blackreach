[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackreach"
version = "5.0.0-beta.2"
description = "Autonomous browser agent that accomplishes goals through web browsing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"  # the starsearch browser backend requires >=3.11; runtime is 3.12
authors = [
    {name = "Phnix"}
]
keywords = [
    "browser", "automation", "agent", "ai", "llm",
    "web", "scraping", "autonomous"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.0",
    "undetected-playwright>=0.3.0",
    "starsearch>=0.2.0",  # anti-detect browser backend (sibling repo; see [tool.uv.sources])
    "beautifulsoup4>=4.12.0",
    "ollama>=0.1.0",
    "openai>=1.0.0",  # xAI/Grok (OpenAI-compatible) — the sanctioned agent reasoning brain
    "click>=8.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "prompt-toolkit>=3.0.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "flask>=2.3.0",
    "waitress>=3.0.0",
]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
google = ["google-genai>=0.1.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-genai>=0.1.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
blackreach = "blackreach.cli:main"
blackreach-server = "mcp_server.blackreach_http_server:main"

[project.urls]
Homepage = "https://github.com/Null-Phnix/Blackreach"
Documentation = "https://github.com/Null-Phnix/Blackreach#readme"
Repository = "https://github.com/Null-Phnix/Blackreach"
Issues = "https://github.com/Null-Phnix/Blackreach/issues"

[tool.uv.sources]
# StarSearch's Python client lives in the sibling repo, not on PyPI. Declaring it
# here (instead of a manual `uv pip install -e .../client`) makes `uv sync` install
# and KEEP it as an editable install rather than pruning the browser backend on every
# sync. Requires the suite's standard sibling layout (Project_StarSearch beside Blackreach).
starsearch = { path = "../Project_StarSearch/client", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["blackreach*"]

[tool.setuptools.package-data]
blackreach = ["../prompts/*.txt"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "network: marks tests as requiring network access",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["blackreach"]
omit = ["tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
